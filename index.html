<!DOCTYPE html>
<html>
<head>
  <title>Guardar datos</title>
</head>
<body>

  <h2>Guardar datos</h2>

  <button onclick="enviar()">Guardar</button>

  <script>
    function enviar() {
      fetch("https://upgraded-engine-x7r75v47gp5cvpx4-3000.app.github.dev/guardar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          nombre: "Alejandro"
        })
      })
      .then(res => {
        if (res.status === 201) {
          alert("Datos guardados correctamente");
        } else {
          alert("Error");
        }
      })
      .catch(error => {
        alert("Error de conexión");
        console.log(error);
      });
    }
  </script>

</body>
</html>
